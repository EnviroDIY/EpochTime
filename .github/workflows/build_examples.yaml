name: Build Examples

# Triggers the workflow on push or pull request events
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native_tests:
    name: Native conversion tests
    if: ${{ ! contains(github.event.head_commit.message, 'ci skip') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compile and run native tests
        run: bash tests/run_native_tests.sh

  build_examples:
    name: Build Examples
    if: ${{ ! contains(github.event.head_commit.message, 'ci skip') }}
    uses: EnviroDIY/workflows/.github/workflows/build_examples.yaml@main
    with:
      examples_to_build: "examples/TimeFormatting"
    secrets: inherit
